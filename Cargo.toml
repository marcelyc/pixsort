[package]
name = "pixsort"
version = "0.1.0"
edition = "2024"
description = "Pixsort 图片分类工具"

[package.metadata.winresource]
FileDescription = "Pixsort 图片分类工具"
ProductName = "Pixsort"
OriginalFilename = "pixsort.exe"
InternalName = "Pixsort"
LegalCopyright = "Copyright © 2026 Pixsort"
LegalTrademark = "Pixsort"

[build-dependencies]
winresource = "0.1.34"

[dependencies]
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
