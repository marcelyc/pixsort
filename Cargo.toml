[package]
name = "pixsort"
version = "1.0.0"
edition = "2024"
description = "arp"

[[bin]]
name = "arp"
path = "src/main.rs"

[package.metadata.winresource]
FileDescription = "arp"
FileVersion = "1.0.0.0"
ProductName = "arp"
ProductVersion = "1.0.0.0"
OriginalFilename = "arp.exe"
InternalName = "arp"
LegalCopyright = "arp"
LegalTrademark = "arp"

[build-dependencies]
winresource = "0.1.34"

[dependencies]
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
